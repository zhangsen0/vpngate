# ============================================================
# 生产环境自动部署：Cloudflare Pages
# 触发：push 到 main（或手动触发）
# 前置：仓库 Secrets 需配置
#   CF_API_TOKEN        = 生产环境 API 令牌
#   CF_ACCOUNT_ID       = 生产环境账户 ID
#   CF_KV_NAMESPACE_ID  = 生产 KV 命名空间 ID（vpngate-cfg）
#   CF_APP_PASSWORD     = 访问密码（登录用）
# 项目：vpngate（Pages 项目名，域名 vpngate.520215.xyz）
# ============================================================
name: Deploy to Cloudflare Pages (production)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: 代码检查（语法 + 单元测试）
        run: |
          node scripts/check-syntax.mjs
          node scripts/check-unit.mjs

      - name: 写入生产绑定配置（KV 绑定；部署时 wrangler 按此同步项目级绑定）
        run: |
          cat > wrangler.toml <<'EOF'
          name = "vpngate"
          compatibility_date = "2025-09-01"
          pages_build_output_dir = "dist"

          [[kv_namespaces]]
          binding = "VPNGATE_CFG"
          id = "${CF_KV_NAMESPACE_ID}"
          EOF
        env:
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      - name: 组装部署包
        run: |
          node scripts/package.mjs dist

      - name: 部署到 Cloudflare Pages（生产）
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: vpngate
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'

      - name: 部署后校验/写回绑定（KV + APP_PASSWORD，幂等）
        run: |
          BODY=$(python3 - <<'PYEOF'
          import json, os
          kv_id = os.environ['CF_KV_NAMESPACE_ID']
          pwd = os.environ['CF_APP_PASSWORD']
          body = {"deployment_configs": {"production": {}, "preview": {}}}
          for stage in ("production", "preview"):
              body["deployment_configs"][stage]["kv_namespaces"] = {"VPNGATE_CFG": {"namespace_id": kv_id}}
              if pwd:
                  body["deployment_configs"][stage]["env_vars"] = {"APP_PASSWORD": {"type": "secret_text", "value": pwd}}
          print(json.dumps(body))
          PYEOF
          )
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/vpngate" \
            -d "${BODY}" | python3 -c "import json,sys; d=json.load(sys.stdin); print('绑定写回：', 'OK' if d.get('success') else d.get('errors'))"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_APP_PASSWORD: ${{ secrets.CF_APP_PASSWORD }}
