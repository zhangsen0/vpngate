<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VPNGate 节点优选：拉取实时节点，可配置权重与探测参数，一键优选并生成可用 OpenVPN 节点配置" />
  <title>VPNGate 优选</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b82f6'/%3E%3Cpath d='M34 12 18 36h12l-4 16 18-26H30z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css?v=6" />
</head>
<body data-theme="dark">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none">
          <path d="M38 10 18 38h13l-5 16 22-30H34z" fill="currentColor" />
        </svg>
      </span>
      <span class="brand-name">
        <span class="title">VPNGate <em>优选</em></span>
        <span class="sub">节点优选 · 连通实测 · 配置生成</span>
      </span>
      <span class="status" id="statusText">加载中…</span>
    </div>
    <div class="actions">
      <button class="btn" id="btnRefresh" title="强制从数据源重新拉取列表">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        刷新
      </button>
      <button class="btn" id="btnLogs" title="查看操作日志">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        日志
      </button>
      <button class="btn btn-primary" id="btnOptimize">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4.5 13.5H11L9.5 22 19 10h-6.5z"/></svg>
        立即优选
      </button>
      <button class="btn" id="btnConfig" title="参数配置">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        配置
      </button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="searchInput" placeholder="搜索 IP / 主机名 / 运营商…" autocomplete="off" />
      </div>
      <select class="select" id="countrySelect" title="按国家筛选">
        <option value="">全部国家</option>
      </select>
      <select class="select" id="sortSelect" title="排序方式"></select>
      <label class="check" title="仅显示 CF 边缘探测可达的节点">
        <input type="checkbox" id="reachableOnly" /> 仅可连通
      </label>
      <label class="check" title="仅显示本机校验为可达的节点">
        <input type="checkbox" id="lcOnly" /> 仅本机可达
      </label>
      <span class="meta" id="metaText"></span>
    </section>

    <section class="table-wrap">
      <div class="table-scroll">
        <table id="serverTable">
          <thead>
            <tr>
              <th>#</th>
              <th>国家</th>
              <th>IP / 主机名</th>
              <th class="num">Ping</th>
              <th class="num">速度</th>
              <th class="num">评分</th>
              <th class="num">在线</th>
              <th class="num">会话</th>
              <th>本机</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="serverTbody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyText" hidden>
        <div class="empty-icon">📡</div>
        暂无数据，点击「刷新」获取 VPNGate 节点
      </div>
    </section>
  </main>

  <!-- 节点详情抽屉 -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <span>节点详情 <span class="sub" id="drawerSub"></span></span>
      <button class="btn-close" id="btnCloseDrawer" title="关闭">×</button>
    </div>
    <div id="drawerBody"></div>
  </aside>

  <!-- 优选结果面板 -->
  <div class="modal-mask" id="optMask" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <span>⚡ 优选结果</span>
        <button class="btn-close" id="btnCloseOpt" title="关闭">×</button>
      </div>
      <div class="modal-body" id="optBody"></div>
    </div>
  </div>

  <!-- 配置面板 -->
  <div class="modal-mask" id="cfgMask" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <span>⚙ 参数配置</span>
        <div class="modal-actions">
          <button class="btn" id="btnResetCfg">恢复默认</button>
          <button class="btn btn-primary" id="btnSaveCfg">保存配置</button>
          <button class="btn-close" id="btnCloseCfg" title="关闭">×</button>
        </div>
      </div>
      <div class="modal-body" id="cfgBody"></div>
    </div>
  </div>

  <!-- 多端一键使用 -->
  <div class="modal-mask" id="pfMask" hidden>
    <div class="modal">
      <div class="modal-head">
        <span>📱 多端一键使用</span>
        <button class="btn-close" id="btnClosePf" title="关闭">×</button>
      </div>
      <div class="modal-body" id="pfBody"></div>
    </div>
  </div>

  <!-- 本机连通性校验 -->
  <div class="modal-mask" id="lcMask" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <span>📶 本机连通性校验</span>
        <div class="modal-actions">
          <button class="btn" id="btnLcProbe" title="页面为 http 访问时可直接探测">浏览器直连</button>
          <button class="btn" id="btnLcCopyCmd" title="生成可在本机终端运行的 TCP 探测命令">复制命令</button>
          <button class="btn" id="btnLcDownload" title="下载单文件探测页，本机 http 打开后浏览器直测">下载探测页</button>
          <button class="btn-close" id="btnCloseLc" title="关闭">×</button>
        </div>
      </div>
      <div class="modal-body" id="lcBody"></div>
    </div>
  </div>

  <!-- 操作日志 -->
  <div class="modal-mask" id="logMask" hidden>
    <div class="modal modal-wide">
      <div class="modal-head">
        <span>📋 操作日志</span>
        <div class="modal-actions">
          <button class="btn" id="btnLogRefresh">刷新</button>
          <button class="btn-close" id="btnCloseLog" title="关闭">×</button>
        </div>
      </div>
      <div class="modal-body" id="logBody"></div>
    </div>
  </div>

  <footer class="foot">
    <span id="footText"></span>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/zhangsen0/vpngate" target="_blank" rel="noopener">源码</a>
    <span aria-hidden="true">·</span>
    <a href="#" id="btnLogout">退出登录</a>
  </footer>

  <div class="toast" id="toast" hidden></div>
  <script src="/app.js?v=6"></script>
</body>
</html>
