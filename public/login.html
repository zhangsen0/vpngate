<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>登录 · VPNGate 优选</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #0f1115; color: #e6e9ef;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      width: min(360px, 92vw);
      background: #171a21; border: 1px solid #2a2f3a; border-radius: 14px;
      padding: 28px 26px;
    }
    .logo { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    .logo span { color: #60a5fa; }
    .sub { text-align: center; color: #8b93a5; font-size: 13px; margin-bottom: 22px; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 12px;
      border: 1px solid #2a2f3a; border-radius: 8px;
      background: #1e222c; color: #e6e9ef; outline: none; font-size: 14px;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #3b82f6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #60a5fa; }
    .err { color: #ef4444; font-size: 13px; margin-bottom: 10px; min-height: 18px; text-align: center; }
    .foot { margin-top: 16px; text-align: center; color: #5b6270; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">VPNGate<span>优选</span></div>
    <div class="sub">请输入访问密码</div>
    <div class="err" id="err"></div>
    <form id="form" autocomplete="off">
      <input type="password" id="password" placeholder="访问密码" autofocus />
      <button type="submit" id="btn">登 录</button>
    </form>
    <div class="foot">仅限授权访问</div>
  </div>
  <script>
    (function () {
      var next = new URLSearchParams(location.search).get('next') || '/';
      var form = document.getElementById('form');
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pwd = document.getElementById('password').value;
        if (!pwd) { err.textContent = '请输入密码'; return; }
        btn.disabled = true; btn.textContent = '验证中…';
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        }).then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || '密码错误'); });
          location.href = next;
        }).catch(function (e2) {
          err.textContent = e2.message || '登录失败';
          btn.disabled = false; btn.textContent = '登 录';
        });
      });
      document.getElementById('password').focus();
    })();
  </script>
</body>
</html>
