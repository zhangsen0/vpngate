<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>登录 · VPNGate 优选</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      background: #0b0e14;
      background-image: radial-gradient(900px 500px at 80% -10%, rgba(59,130,246,0.14), transparent 60%),
                        radial-gradient(700px 500px at -10% 110%, rgba(99,102,241,0.10), transparent 55%);
      background-attachment: fixed;
      color: #e8ecf4;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .card {
      width: min(370px, 94vw);
      background: #12161f;
      border: 1px solid #232b3a; border-radius: 18px;
      padding: 34px 30px 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    .mark {
      width: 46px; height: 46px; margin: 0 auto 14px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      border-radius: 13px; color: #fff;
      box-shadow: 0 6px 18px rgba(59,130,246,0.4);
    }
    .mark svg { width: 26px; height: 26px; }
    .logo { font-size: 20px; font-weight: 700; text-align: center; }
    .logo em { font-style: normal; color: #60a5fa; }
    .sub { text-align: center; color: #8b94a8; font-size: 13px; margin: 6px 0 26px; }
    input {
      width: 100%; padding: 12px 14px; margin-bottom: 12px;
      border: 1px solid #2e3850; border-radius: 10px;
      background: #171d29; color: #e8ecf4; outline: none; font-size: 14px;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.18); }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
      color: #fff; font-size: 14.5px; font-weight: 600; cursor: pointer;
      box-shadow: 0 6px 18px rgba(59,130,246,0.35);
      transition: filter .15s;
    }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .err { color: #f87171; font-size: 13px; margin-bottom: 10px; min-height: 18px; text-align: center; }
    .foot { margin-top: 20px; text-align: center; color: #5c6478; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><path d="M38 10 18 38h13l-5 16 22-30H34z" fill="currentColor"/></svg>
    </div>
    <div class="logo">VPNGate <em>优选</em></div>
    <div class="sub">请输入访问密码</div>
    <div class="err" id="err"></div>
    <form id="form" autocomplete="off">
      <input type="password" id="password" placeholder="访问密码" autofocus />
      <button type="submit" id="btn">登 录</button>
    </form>
    <div class="foot">仅限授权访问 · 会话有效期 7 天</div>
  </div>
  <script>
    (function () {
      var next = new URLSearchParams(location.search).get('next') || '/';
      var form = document.getElementById('form');
      var err = document.getElementById('err');
      var btn = document.getElementById('btn');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pwd = document.getElementById('password').value;
        if (!pwd) { err.textContent = '请输入密码'; return; }
        btn.disabled = true; btn.textContent = '验证中…';
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd }),
        }).then(function (res) {
          if (!res.ok) return res.json().then(function (d) { throw new Error(d.error || '密码错误'); });
          location.href = next;
        }).catch(function (e2) {
          err.textContent = e2.message || '登录失败';
          btn.disabled = false; btn.textContent = '登 录';
        });
      });
      document.getElementById('password').focus();
    })();
  </script>
</body>
</html>
